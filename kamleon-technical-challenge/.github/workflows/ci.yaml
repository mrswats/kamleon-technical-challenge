---
name: Run tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          if [ -f test-requirements.txt ]; then
            pip install --require-hashes -r test-requirements.txt
            pip install --no-deps .
          else
            pip install ".[test]"
          fi

      # covdefaults makes this fail below 100% coverage (tests included).
      # Each xdist worker migrates and uses its own database on the service container.
      - name: Run Tests
        run: python -m pytest -n 4 --cov --cov-report term-missing
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
