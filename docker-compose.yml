---
services:
  db:
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s

  api:
    image: kamleon:local
    build: .
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      MODE: api
    depends_on:
      db:
        condition: service_healthy
