[project]
name = "kamleon"
version = "0.1.0"
description = "Customers, connected devices and their measurements: a FastAPI + PostgreSQL service"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = [
    "LICENSE",
]
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "pydantic[email]",
    "sqlalchemy",
    "sqlalchemy[asyncio]",
    "uvicorn",
    "uvicorn-worker",
]

[project.optional-dependencies]
test = [
    "covdefaults",
    "fakeredis",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
]
dev = [
    "mypy",
    "pre-commit",
]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "kamleon*",
]

[tool.autoflake]
recursive = true

[tool.mypy]
files = "."
ignore_missing_imports = true
strict = true
exclude = [
    "tests/",
    "migrations/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]

[tool.coverage.run]
plugins = [
    "covdefaults",
]
omit = [
    "kamleon/asgi.py",
    "migrations/*",
]

[tool.coverage.html]
directory = "artifacts/htmlcov/"
